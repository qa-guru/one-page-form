name: Deploy One Page Form Demos

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir pages
          cp *.html allure-shell.css allure-shell.js dashboard-overrides.css allure-report-logo.svg allure-testops-logo.svg pages/
          touch pages/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages
          enable_jekyll: false
