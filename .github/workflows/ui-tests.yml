name: UI Tests

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: "TestOps service parameter. Leave blank"
        required: false
      ALLURE_USERNAME:
        description: "TestOps service parameter. Leave blank"
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      ALLURE_ENDPOINT: https://allure.autotests.cloud
      ALLURE_PROJECT_ID: 5263
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
      ALLURE_RESULTS: build/allure-results
      BROWSER_VERSION: '148'
    defaults:
      run:
        working-directory: tests-java

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Selenium browsers and drivers
        uses: actions/cache@v5
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-chrome-${{ env.BROWSER_VERSION }}
          restore-keys: |
            selenium-${{ runner.os }}-chrome-

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@v1

      - name: Run UI tests
        run: allurectl watch -- ./gradlew test -Denv=ci -DbrowserVersion=${{ env.BROWSER_VERSION }}

      - name: Load Allure report history
        if: always()
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history
        if: always()
        working-directory: tests-java
        run: |
          if [ -f ../gh-pages/allure-reports/history.jsonl ]; then
            cp ../gh-pages/allure-reports/history.jsonl history.jsonl
          fi

      - name: Add Allure executor info
        if: always()
        working-directory: tests-java
        run: |
          mkdir -p build/allure-results
          cat > build/allure-results/executor.json <<EOF
          {
            "reportName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/${{ github.run_number }}/index.html",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Set Allure report variables
        if: always()
        working-directory: tests-java
        run: |
          jq --arg environment "ci" \
             --arg build "#${{ github.run_number }}" \
             --arg branch "${{ github.head_ref || github.ref_name }}" \
             '.variables += {
               "Environment": $environment,
               "Build": $build,
               "Branch": $branch
             }' allurerc.json > allurerc.ci.json
          mv allurerc.ci.json allurerc.json

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Prepare GitHub Pages site
        if: always()
        working-directory: .
        run: |
          REPORT_ID="${{ github.run_number }}"
          REPORT_DIR="pages/allure-reports/${REPORT_ID}"
          REPORT_SRC="tests-java/build/reports/allure-report/allureReport"
          DASHBOARD_SRC="${REPORT_SRC}/dashboard"
          LANDING_DIR="pages/allure-reports"

          mkdir -p pages

          if [ -d gh-pages ]; then
            cp -a gh-pages/. pages/
          fi

          rm -rf pages/allure-report

          cp *.html pages/
          mkdir -p "$REPORT_DIR"
          cp -r "${REPORT_SRC}/." "$REPORT_DIR/"

          if [ -f tests-java/history.jsonl ]; then
            cp tests-java/history.jsonl "${LANDING_DIR}/history.jsonl"
          fi

          if [ -d "$DASHBOARD_SRC" ]; then
            find "${LANDING_DIR}" -maxdepth 1 -type f ! -name 'history.jsonl' -delete
            cp -r "${DASHBOARD_SRC}/." "${LANDING_DIR}/"
          fi

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages

      - name: Post Allure summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: allure-framework/allure-action@v0.7.2
        with:
          report-directory: tests-java/build/reports/allure-report/allureReport
          remote-href: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/${{ github.run_number }}/"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sections: |
            new
            flaky

      - name: Allure report links
        if: always()
        working-directory: .
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/${{ github.run_number }}/index.html"
          DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/"

          echo "Allure report (this run): ${REPORT_URL}"
          echo "Allure dashboard:         ${DASHBOARD_URL}"
          echo "::notice title=Allure Report::${REPORT_URL}"

          {
            echo "## Allure Report"
            echo ""
            echo "- [Dashboard с trends](${DASHBOARD_URL})"
            echo "- [Run #${{ github.run_number }}](${REPORT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
