name: UI Tests

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: "TestOps service parameter. Leave blank"
        required: false
      ALLURE_USERNAME:
        description: "TestOps service parameter. Leave blank"
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      ALLURE_ENDPOINT: https://allure.autotests.cloud
      ALLURE_PROJECT_ID: 5263
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
      ALLURE_RESULTS: build/allure-results
    defaults:
      run:
        working-directory: tests-java

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Selenium browsers and drivers
        uses: actions/cache@v5
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-chrome-stable
          restore-keys: |
            selenium-${{ runner.os }}-chrome-

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@v1

      - name: Run UI tests
        run: allurectl watch -- gradle test -Denv=ci

      - name: Load Allure report history
        if: always()
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history
        if: always()
        working-directory: tests-java
        run: |
          if [ -f ../gh-pages/allure-reports/history.jsonl ]; then
            cp ../gh-pages/allure-reports/history.jsonl history.jsonl
          fi

      - name: Add Allure executor info
        if: always()
        working-directory: tests-java
        run: |
          mkdir -p build/allure-results
          cat > build/allure-results/executor.json <<EOF
          {
            "reportName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/${{ github.run_number }}/index.html",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Generate Allure report
        if: always()
        run: gradle allureReport

      - name: Prepare GitHub Pages site
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          REPORT_ID="${{ github.run_number }}"
          REPORT_DIR="pages/allure-reports/${REPORT_ID}"

          mkdir -p pages

          if [ -d gh-pages ]; then
            cp -a gh-pages/. pages/
          fi

          rm -rf pages/allure-report

          cp *.html pages/
          mkdir -p "$REPORT_DIR"
          cp -r tests-java/build/reports/allure-report/allureReport/. "$REPORT_DIR/"

          if [ -f tests-java/history.jsonl ]; then
            cp tests-java/history.jsonl pages/allure-reports/history.jsonl
          fi

          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="utf-8">'
            echo '  <title>Allure Reports</title>'
            echo '  <style>'
            echo '    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }'
            echo '    a { color: #0969da; }'
            echo '    li { margin: 0.5rem 0; }'
            echo '  </style>'
            echo '</head>'
            echo '<body>'
            echo '  <h1>Allure Reports</h1>'
            echo '  <ul>'
            for dir in $(find pages/allure-reports -mindepth 1 -maxdepth 1 -type d | sort -Vr); do
              run=$(basename "$dir")
              echo "    <li><a href=\"${run}/index.html\">Run #${run}</a></li>"
            done
            echo '  </ul>'
            echo '</body>'
            echo '</html>'
          } > pages/allure-reports/index.html

      - name: Publish Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages

      - name: Allure report links
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/${{ github.run_number }}/index.html"
          INDEX_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-reports/"

          echo "Allure report (this run): ${REPORT_URL}"
          echo "Allure reports index:     ${INDEX_URL}"
          echo "::notice title=Allure Report::${REPORT_URL}"

          {
            echo "## Allure Report"
            echo ""
            echo "- [Run #${{ github.run_number }}](${REPORT_URL})"
            echo "- [All reports index](${INDEX_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
