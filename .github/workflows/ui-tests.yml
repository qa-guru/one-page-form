name: UI Tests

on:
  workflow_dispatch:
  push:
    branches: [cicd]
  pull_request:
    branches: [cicd]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-java

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Selenium browsers and drivers
        uses: actions/cache@v5
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-chrome-stable
          restore-keys: |
            selenium-${{ runner.os }}-chrome-

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Run UI tests
        run: gradle test -Denv=ci

      - name: Generate Allure report
        if: always()
        run: gradle allureReport

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: tests-java/build/reports/allure-report/
