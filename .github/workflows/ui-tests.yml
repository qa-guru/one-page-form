name: UI Tests

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: "TestOps service parameter. Leave blank"
        required: false
      ALLURE_USERNAME:
        description: "TestOps service parameter. Leave blank"
        required: false
  push:
    branches: [cicd]
  pull_request:
    branches: [cicd]

permissions:
  contents: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      ALLURE_ENDPOINT: https://allure.autotests.cloud
      ALLURE_PROJECT_ID: 5263
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
      ALLURE_RESULTS: build/allure-results
    defaults:
      run:
        working-directory: tests-java

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Selenium browsers and drivers
        uses: actions/cache@v5
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-chrome-stable
          restore-keys: |
            selenium-${{ runner.os }}-chrome-

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@v1

      - name: Run UI tests
        run: allurectl watch -- gradle test -Denv=ci

      - name: Load Allure report history
        if: always()
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history
        if: always()
        working-directory: tests-java
        run: |
          if [ -d ../gh-pages/allure-report/history ]; then
            mkdir -p build/allure-results/history
            cp -r ../gh-pages/allure-report/history/. build/allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: gradle allureReport

      - name: Prepare GitHub Pages site
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          mkdir -p pages/allure-report
          cp *.html pages/
          cp -r tests-java/build/reports/allure-report/allureReport/. pages/allure-report/

      - name: Publish Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages
