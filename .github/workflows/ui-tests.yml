name: UI Tests

on:
  workflow_dispatch:
  push:
    branches: [cicd]
  pull_request:
    branches: [cicd]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-java

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Selenium browsers and drivers
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-chrome-stable
          restore-keys: |
            selenium-${{ runner.os }}-chrome-

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Run UI tests
        run: |
          python3 -m http.server 8080 --directory .. &
          sleep 1
          gradle test
        env:
          CI: true
          BASE_URL: http://127.0.0.1:8080

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests-java/build/reports/tests/test/
