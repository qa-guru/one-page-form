name: UI Tests

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        description: "TestOps service parameter. Leave blank"
        required: false
      ALLURE_USERNAME:
        description: "TestOps service parameter. Leave blank"
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      ALLURE_ENDPOINT: https://allure.autotests.cloud
      ALLURE_PROJECT_ID: 5263
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
      ALLURE_RESULTS: build/allure-results
    defaults:
      run:
        working-directory: tests-java

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Selenium browsers and drivers
        uses: actions/cache@v5
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-chrome-stable
          restore-keys: |
            selenium-${{ runner.os }}-chrome-

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@v1

      - name: Run UI tests
        run: allurectl watch -- gradle test -Denv=ci

      - name: Load Allure report history
        if: always()
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history
        if: always()
        working-directory: tests-java
        run: |
          LATEST_REPORT=$(find ../gh-pages/allure-reports -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_REPORT" ] && [ -d "$LATEST_REPORT/history" ]; then
            mkdir -p build/allure-results/history
            cp -r "$LATEST_REPORT/history/." build/allure-results/history/
          elif [ -d ../gh-pages/allure-report/history ]; then
            mkdir -p build/allure-results/history
            cp -r ../gh-pages/allure-report/history/. build/allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: gradle allureReport

      - name: Prepare GitHub Pages site
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          REPORT_ID="${{ github.run_number }}"
          REPORT_DIR="pages/allure-reports/${REPORT_ID}"

          mkdir -p pages

          if [ -d gh-pages ]; then
            cp -a gh-pages/. pages/
          fi

          cp *.html pages/
          mkdir -p "$REPORT_DIR"
          cp -r tests-java/build/reports/allure-report/allureReport/. "$REPORT_DIR/"

          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="utf-8">'
            echo '  <title>Allure Reports</title>'
            echo '  <style>'
            echo '    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }'
            echo '    a { color: #0969da; }'
            echo '    li { margin: 0.5rem 0; }'
            echo '  </style>'
            echo '</head>'
            echo '<body>'
            echo '  <h1>Allure Reports</h1>'
            echo '  <ul>'
            for dir in $(find pages/allure-reports -mindepth 1 -maxdepth 1 -type d | sort -Vr); do
              run=$(basename "$dir")
              echo "    <li><a href=\"${run}/index.html\">Run #${run}</a></li>"
            done
            echo '  </ul>'
            echo '</body>'
            echo '</html>'
          } > pages/allure-reports/index.html

      - name: Publish Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages
