<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Tests Dashboard</title>
  <style>
    :root {
      --bg: #f5f0e8;
      --surface: #2c2a26;
      --text: #222;
      --muted: #6b6b6b;
      --primary: #20aee3;
      --border: #e3e9f5;
      --button: #1677f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--surface);
      color: #f5f0e8;
      padding: 20px 24px;
    }
    header h1 { margin: 0 0 6px; font-size: 1.6rem; }
    header p { margin: 0; color: rgba(245, 240, 232, 0.75); }
    main { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .panel h2 {
      margin: 0;
      font-size: 1.2rem;
      border-left: 4px solid var(--primary);
      padding-left: 12px;
    }
    .panel h2 a {
      color: inherit;
      text-decoration: none;
    }
    .panel h2 a:hover { color: var(--button); }
    .report-link {
      color: var(--button);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }
    .report-link:hover { text-decoration: underline; }
    .dashboard-frame {
      width: 100%;
      min-height: 720px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }
    .empty-state {
      margin: 0;
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
      background: #f8fbff;
      border-radius: 12px;
    }
    .branches ul {
      margin: 0;
      padding-left: 20px;
      columns: 2;
      gap: 24px;
    }
    .branches a { color: var(--button); text-decoration: none; }
    .branches a:hover { text-decoration: underline; }
    .note {
      margin: 0 0 16px;
      padding: 12px 14px;
      background: #f8fbff;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    @media (max-width: 768px) {
      .branches ul { columns: 1; }
      .dashboard-frame { min-height: 560px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>UI Tests Dashboard</h1>
    <p>Тренды по веткам. Для дерева тестов откройте полный отчёт.</p>
  </header>
  <main>
    <p class="note">Dashboard показывает только аналитику. Чтобы кликнуть по тестам, откройте ссылку «полный отчёт» у нужной ветки.</p>
    <section class="panel branches">
      <h2>Навигация</h2>
      <ul>
        <li><a href="main/">main</a></li> <li><a href="main/28110638927/index.html">main — последний run</a></li>
      </ul>
    </section>
    
    <section class="panel">
      <div class="panel-head">
        <h2><a href="main/">main</a></h2>
        <a class="report-link" href="main/28110638927/index.html">полный отчёт →</a>
      </div>
      <iframe class="dashboard-frame" src="main/dashboard/index.html" title="Dashboard: main"></iframe>
    </section>
  </main>
</body>
</html>
